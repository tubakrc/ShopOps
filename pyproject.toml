[project]
name = "shopops"
version = "0.1.0"
description = "Pazaryeri müşteri destek ve operasyon ajanı (Olist verisi)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "kagglehub>=0.3",
    "numpy>=1.26",
    "openai>=1.40",
    "pydantic>=2.6",
    "pytest>=8.0",
    "python-dotenv>=1.0",
    "sentence-transformers>=3.0",
    "streamlit>=1.66.1",
    "torch>=2.15.0",
]

[tool.uv]
package = false

   [[tool.uv.index]]
   name = "pytorch-cpu"
   url = "https://download.pytorch.org/whl/cpu"
   explicit = true

   [tool.uv.sources]
   torch = [{ index = "pytorch-cpu" }]
